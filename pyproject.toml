[project]
name = "postech-ml-engineering-fase-5-datathon"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",
    "matplotlib>=3.7.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"