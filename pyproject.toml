[project]
name = "postech-ml-engineering-fase-5-datathon"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "scikit-learn>=1.3.0",
    "mlflow==2.11.3",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "feast (==0.38.0)",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "setuptools (<70.0.0)",
    "protobuf (==4.25.3)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"